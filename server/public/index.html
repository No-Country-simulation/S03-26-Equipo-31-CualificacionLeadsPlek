<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Server Status</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      padding: 2rem;
      min-height: 100vh;
    }

    header {
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 600;
      color: #f8fafc;
    }

    header p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-top: 0.3rem;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .card {
      background: #1e2130;
      border: 1px solid #2d3148;
      border-radius: 10px;
      padding: 1.2rem 1.4rem;
    }

    .card .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-bottom: 0.5rem;
    }

    .card .value {
      font-size: 1.3rem;
      font-weight: 600;
      color: #f1f5f9;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .badge.ok       { background: #14532d; color: #4ade80; }
    .badge.error    { background: #450a0a; color: #f87171; }
    .badge.loading  { background: #1e293b; color: #94a3b8; }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .dot.pulse {
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #1e2130;
      border: 1px solid #2d3148;
      border-radius: 10px;
      overflow: hidden;
    }

    thead tr {
      background: #161824;
    }

    th, td {
      padding: 0.85rem 1.2rem;
      text-align: left;
      font-size: 0.875rem;
      border-bottom: 1px solid #2d3148;
    }

    th {
      color: #64748b;
      font-weight: 500;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
    }

    tr:last-child td { border-bottom: none; }

    .method {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: 5px;
      font-size: 0.75rem;
      font-weight: 700;
      font-family: monospace;
    }

    .method.GET  { background: #0c4a6e; color: #38bdf8; }
    .method.POST { background: #3b0764; color: #c084fc; }

    code {
      font-family: monospace;
      font-size: 0.875rem;
      color: #e2e8f0;
    }

    .desc { color: #94a3b8; }

    footer {
      margin-top: 2rem;
      font-size: 0.78rem;
      color: #475569;
    }
  </style>
</head>
<body>

  <header>
    <h1>server</h1>
    <p>CualificacionLeadsPlek — API Status</p>
  </header>

  <div class="cards">
    <!--
      <div class="card">
        <div class="label">API</div>
        <div id="api-status" class="value">
          <span class="badge loading"><span class="dot pulse"></span> Checking…</span>
        </div>
      </div>
      <div class="card">
        <div class="label">Database</div>
        <div id="db-status" class="value">
          <span class="badge loading"><span class="dot pulse"></span> Checking…</span>
        </div>
      </div>
      -->
    <div class="card">
      <div class="label">Version</div>
      <div class="value" style="font-size:1rem; color:#94a3b8;">1.0.0</div>
    </div>
    <div class="card">
      <div class="label">Environment</div>
      <div class="value" style="font-size:1rem; color:#94a3b8;">development</div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Method</th>
        <th>Endpoint</th>
        <th>Description</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><span class="method GET">GET</span></td>
        <td><code>/api/health</code></td>
        <td class="desc">General API health check</td>
      </tr>
      <tr>
        <td><span class="method GET">GET</span></td>
        <td><code>/api/database/health</code></td>
        <td class="desc">Database connectivity status</td>
      </tr>
      <tr>
        <td><span class="method POST">POST</span></td>
        <td><code>/api/database/connect</code></td>
        <td class="desc">Retry database connection</td>
      </tr>
    </tbody>
  </table>

  <footer id="last-checked">Checking status…</footer>

  <script>
    const BASE = 'http://localhost:3000';

    function badge(ok) {
      return ok
        ? `<span class="badge ok"><span class="dot"></span> Online</span>`
        : `<span class="badge error"><span class="dot"></span> Offline</span>`;
    }

    async function checkStatus() {
      // API health
      try {
        const res = await fetch(`${BASE}/api/health`);
        document.getElementById('api-status').innerHTML = badge(res.ok);
      } catch {
        document.getElementById('api-status').innerHTML = badge(false);
      }

      // DB health
      try {
        const res = await fetch(`${BASE}/api/database/health`);
        const data = await res.json();
        document.getElementById('db-status').innerHTML = badge(data.connected === true);
      } catch {
        document.getElementById('db-status').innerHTML = badge(false);
      }

      document.getElementById('last-checked').textContent =
        `Last checked: ${new Date().toLocaleTimeString()}`;
    }

    checkStatus();
    setInterval(checkStatus, 15000);
  </script>

</body>
</html>
